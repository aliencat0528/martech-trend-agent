             "creative generation", "ai 生成"]
  CDP/第一方數據: ["cdp", "customer data", "第一方數據", "顧客數據", "data platform",
                  "first-party", "data clean room"]
  個人化推薦: ["personalization", "個人化", "recommendation", "推薦引擎", "動態內容"]
  CRM/會員留存: ["crm", "顧客關係", "會員經營", "retention", "留存", "loyalty", "忠誠",
                "churn", "流失", "lifecycle"]
  對話式商務: ["conversational", "chatbot", "對話式", "line oa", "whatsapp", "messaging",
              "聊天機器人", "voice"]
  廣告投放/歸因: ["adtech", "廣告", "dsp", "程序化", "advertising", "attribution", "歸因",
