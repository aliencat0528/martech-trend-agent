# Martech Trend Agent 設定檔
# 要加公司、關鍵詞、新聞來源，改這裡即可，不用動程式碼。

# 職缺來源說明：
# - greenhouse: <board_token> → 走 Greenhouse 官方公開 API（最完整，含內文）
# - 其餘公司 → Yourator 搜尋（公司名命中僱主才收）
# - 104 有 Cloudflare bot 防護，本工具不做規避，故不列為來源
companies:
  # Tier 1：台灣直接對標，追蹤「職缺 + 新聞」
  tier1:
    - name: Appier
      aliases: ["Appier", "沛星"]
      greenhouse: appier
    - name: 漸強實驗室
      aliases: ["漸強實驗室", "漸強", "Crescendo Lab", "Cresclab"]
    - name: 91APP
      aliases: ["91APP", "91app"]
    - name: awoo
      aliases: ["awoo", "阿物"]
    - name: iKala
      aliases: ["iKala", "愛卡拉"]
    - name: Omnichat
      aliases: ["Omnichat"]
    - name: TenMax
      aliases: ["TenMax", "騰學"]
    - name: Vpon
      aliases: ["Vpon", "威朋"]
    - name: Rosetta.ai
      aliases: ["Rosetta.ai", "Rosetta"]
    - name: CloudAD
      aliases: ["CloudAD", "宏推"]
  # Tier 2：國際對標，只追新聞趨勢（不投遞）
  tier2:
    - name: Insider
      aliases: ["Insider One", "useinsider"]
    - name: Braze
      aliases: ["Braze"]
    - name: MoEngage
      aliases: ["MoEngage"]
    - name: Iterable
      aliases: ["Iterable"]
    - name: Klaviyo
      aliases: ["Klaviyo"]
    - name: Bloomreach
      aliases: ["Bloomreach"]
    - name: Zeta Global
      aliases: ["Zeta Global"]

# 職缺搜尋另外用的一般性關鍵詞（抓產業全貌，不限單一公司）
jobSearchKeywords: ["MarTech", "CDP", "廣告科技"]

# 職稱分類規則：由上而下，先命中先分類
roleCategories:
  數據分析:
    ["data analyst", "數據分析", "資料分析", "business analyst", "商業分析", "bi ", "分析師",
     "campaign analyst", "marketing analyst", "analytics"]
  數據科學/ML:
    ["data scientist", "machine learning", "ml ", "演算法", "資料科學", "ai engineer", "nlp"]
  數據工程:
    ["data engineer", "資料工程", "數據工程", "etl"]
  技術顧問/TSE:
    ["technical solution", "solution engineer", "technical support", "技術顧問", "technical account",
     "customer engineer", "implementation"]
  產品/專案:
    ["product manager", "產品經理", "project manager", "專案經理", "product owner"]
  行銷/客戶成功:
    ["marketing", "行銷", "customer success", "客戶成功", "account manager", "業務", "sales",
     "business development", "account executive", "廣告投放", "客戶經理"]
  軟體工程:
    ["software engineer", "backend", "frontend", "fullstack", "軟體工程", "後端", "前端", "devops",
     "sre", "qa"]

# 技能關鍵詞：統計職缺內文出現頻率（回答「市場要我會什麼」）
skillKeywords:
  ["SQL", "Python", "R語言", "Tableau", "Power BI", "Looker", "GA4", "Google Analytics", "Excel",
   "BigQuery", "Snowflake", "Spark", "dbt", "Airflow", "A/B test", "統計", "機器學習",
   "Machine Learning", "LLM", "AI Agent", "GPT", "Prompt", "CRM", "CDP", "SEO", "LINE API",
   "Docker", "Git", "API", "ETL", "Dashboard", "英文"]

# 新聞 RSS 來源（產業媒體 + 指標公司部落格；公司部落格反映廠商正在推什麼應用）
newsFeeds:
  - name: iThome
    url: https://www.ithome.com.tw/rss
  - name: TechOrange
    url: https://buzzorange.com/techorange/feed/
  - name: INSIDE
    url: https://www.inside.com.tw/feed/rss
  # keepAll: 純 MarTech 媒體/公司部落格，文章天生相關，不經關鍵詞過濾全數保留
  # company: 公司部落格，文章自動掛該公司標記
  - name: MarTech.org
    url: https://martech.org/feed/
    keepAll: true
  - name: MarketingDive
    url: https://www.marketingdive.com/feeds/news/
  - name: ChiefMartec
    url: https://chiefmartec.com/feed/
    keepAll: true
    maxAgeDays: 180   # 低頻高價值：年度 Landscape 等重磅文
  - name: MarTech Series
    url: https://martechseries.com/feed/
    keepAll: true
  - name: Appier Blog
    url: https://www.appier.com/en/blog/rss.xml
    keepAll: true
    company: Appier
    maxAgeDays: 365   # 官方部落格低頻，但反映產品主打方向
  - name: Insider Blog
    url: https://www.insiderone.com/blog/feed/
    keepAll: true
    company: Insider

